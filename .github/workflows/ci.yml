name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: personal_ai_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        command: redis-server --requirepass test_redis_password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a test_redis_password ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/personal_ai_os_test
      REDIS_URL: redis://:test_redis_password@localhost:6379/0
      SECRET_KEY: ci-test-secret-key-do-not-use-in-production
      AI_PROVIDER: siliconflow
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx asyncpg

      - name: Run Alembic migration
        run: |
          cd backend
          source venv/bin/activate
          alembic upgrade head

      - name: Verify PostgreSQL connection
        run: |
          cd backend
          source venv/bin/activate
          python -c "
          import asyncio
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text
          
          async def check():
              engine = create_async_engine('postgresql+asyncpg://postgres:test_password@localhost:5432/personal_ai_os_test')
              async with engine.connect() as conn:
                  result = await conn.execute(text('SELECT version()'))
                  version = result.scalar()
                  print(f'PostgreSQL connected: {version}')
                  
                  # 验证 pgvector
                  result = await conn.execute(text('SELECT extname FROM pg_extension WHERE extname = %s', ('vector',)))
                  if result.scalar():
                      print('pgvector extension: installed')
                  else:
                      print('pgvector extension: NOT INSTALLED')
                      exit(1)
              await engine.dispose()
          
          asyncio.run(check())
          "

      - name: Run tests
        run: |
          cd backend
          source venv/bin/activate
          python -m pytest tests/ -v --tb=short

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: personal-ai-os-backend:test

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: personal-ai-os-frontend:test
