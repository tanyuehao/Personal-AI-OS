version: '3.8'

services:
  # 前端服务
  frontend:
    # 本地构建（开发模式）
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # 或使用 Docker Hub 镜像（生产模式，取消注释下面这行）
    # image: ${DOCKERHUB_USERNAME:-tanyuehao}/personal-ai-os-frontend:${VERSION:-latest}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    networks:
      - personal-ai-os
    restart: unless-stopped

  # 后端 API 服务
  backend:
    # 本地构建（开发模式）
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 或使用 Docker Hub 镜像（生产模式，取消注释下面这行）
    # image: ${DOCKERHUB_USERNAME:-tanyuehao}/personal-ai-os-backend:${VERSION:-latest}
    ports:
      - "8000:8000"
    depends_on:
      - database
      - redis
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@database:5432/personal_ai_os
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - AI_PROVIDER=${AI_PROVIDER:-siliconflow}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-deepseek-ai/DeepSeek-V3}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - EMBEDDING_DIMENSION=1024
    volumes:
      - uploads:/app/uploads
    networks:
      - personal-ai-os
    restart: unless-stopped

  # PostgreSQL 数据库
  database:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=personal_ai_os
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - personal-ai-os
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - personal-ai-os
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  personal-ai-os:
    driver: bridge
